services:
  postgres:
    image: postgres:14.24-alpine
    container_name: narrative-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: narrative
      POSTGRES_PASSWORD: narrative
      POSTGRES_DB: narrative_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narrative -d narrative_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
